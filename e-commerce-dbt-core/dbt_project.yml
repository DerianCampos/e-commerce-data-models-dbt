name: 'e_commerce_dbt_core'
version: '1.0.0'
config-version: 2

profile: 'e_commerce_dbt_core'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  e_commerce_dbt_core:
    +group: e_commerce_core
    staging:
      +materialized: view
      +access: private
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +access: public
