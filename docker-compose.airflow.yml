# Airflow local stack that schedules dbt runs (BashOperator).
# Single-node setup: LocalExecutor (scheduler runs the tasks), one webserver,
# and its OWN metadata database. All services share the external Docker network
# so dbt tasks can reach the e-commerce Postgres (e-commerce_api_app_db).

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-env
    # --- Airflow core ---
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?set FERNET_KEY first (see runbook)}
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Costa_Rica
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-airflow_lab_secret}
    # --- dbt connection (the DATA database, on the shared network) ---
    POSTGRES_HOST: ${POSTGRES_HOST}
    POSTGRES_PORT: ${POSTGRES_PORT}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    DBT_SCHEMA_CORE: ${DBT_SCHEMA_CORE}
    DBT_PROFILES_DIR: /usr/app/e-commerce-dbt-core
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./e-commerce-dbt-core:/usr/app/e-commerce-dbt-core
  networks:
    - airflow-net
    - e-commerce-api-python_template_network
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    # Metadata database for Airflow itself — NOT the e-commerce data DB.
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    networks:
      - airflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    # One-shot setup: migrate the metadata DB and create the admin user.
    <<: *airflow-common
    restart: "no"
    # NOTE: keep every continuation line at the SAME indentation as the first
    # line — with `>` folded style, deeper-indented lines keep their newlines
    # and bash breaks (`syntax error near unexpected token `||'`).
    command: >
      bash -c "airflow db migrate &&
      (airflow users create
      --username admin
      --password '${AIRFLOW_ADMIN_PASSWORD}'
      --firstname Admin
      --lastname Airflow
      --role Admin
      --email admin@example.com
      || echo 'admin user already exists')"

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8085:8080"   # host 8085 -> container 8080 (8080 is used by the API app)

volumes:
  airflow-db:

networks:
  airflow-net:
  e-commerce-api-python_template_network:
    external: true