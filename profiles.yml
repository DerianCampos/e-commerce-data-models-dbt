e_commerce_data_models:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'e-commerce_api_app_db') }}"
      user: "{{ env_var('POSTGRES_USER', 'admin') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'dbpassword') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'e-commerce_db') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'dbt') }}"
      threads: 1
      connect_timeout: 10
